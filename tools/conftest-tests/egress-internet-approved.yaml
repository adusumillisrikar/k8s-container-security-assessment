# Expected: pass. Same policy, approved by platform security (annotation references the exception).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet
  namespace: payments
  annotations: { security.platform/egress-approval: "SEC-1234, payment provider API, expires 2027-01-31" }
spec:
  podSelector: { matchLabels: { app: payments-api } }
  policyTypes: [Egress]
  egress:
    - to: [ { ipBlock: { cidr: 0.0.0.0/0, except: [10.0.0.0/8, 169.254.0.0/16] } } ]
      ports: [ { protocol: TCP, port: 443 } ]
