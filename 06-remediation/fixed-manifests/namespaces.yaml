# Namespace template applied by the platform team for every application namespace.
# Closes F-06 (no admission baseline), F-21 (no quota/limits), F-27 (everything in default).
# The default-deny NetworkPolicies that go with it are in networkpolicies.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: internal-proxy
  labels:
    # Pod Security Admission: built into Kubernetes, same behaviour on EKS/AKS/GKE.
    # `restricted` rejects privileged, host namespaces, hostPath, added capabilities,
    # root users and missing seccomp (F-02, F-03, F-07, F-20).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    owner: team-internal-services
    data-classification: official
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: internal-proxy
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 256Mi }
      max: { memory: 1Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: internal-proxy
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "20"
    services.nodeports: "0"
    services.loadbalancers: "0"
---
# Platform namespace for the few components that genuinely need host access
# (node-exporter, Falco, the CNI). One reviewed exception list, owned by the
# platform team, instead of privileged pods scattered across app namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-node-agents
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
    owner: platform-team
