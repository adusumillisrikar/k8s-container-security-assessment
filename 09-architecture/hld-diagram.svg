<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B42318"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-size: 15px; fill: #475569; }
      .tb { fill: none; stroke: #B42318; stroke-width: 2.2; stroke-dasharray: 9 6; }
      .tbl { font-size: 13px; font-weight: 700; fill: #B42318; letter-spacing: .3px; }
      .env { fill: none; stroke: #64748B; stroke-width: 1.6; stroke-dasharray: 4 4; }
      .envl { font-size: 13px; font-weight: 600; fill: #475569; }
      .box { rx: 10; stroke-width: 1.6; }
      .dev { fill: #EEF4FF; stroke: #3B6FD8; }
      .run { fill: #ECFDF3; stroke: #12805C; }
      .sec { fill: #F4F0FF; stroke: #6941C6; }
      .dat { fill: #FFF6E5; stroke: #B54708; }
      .ext { fill: #F8FAFC; stroke: #64748B; }
      .h { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .t { font-size: 12.5px; fill: #334155; }
      .flow { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
      .flowx { stroke: #B42318; stroke-width: 1.8; fill: none; marker-end: url(#arrRed); stroke-dasharray: 5 4; }
      .fut { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.6; stroke-dasharray: 6 5; }
      .num { fill: #0F172A; }
      .numt { font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>
  <text class="title" x="30" y="44">Target-state secure Kubernetes platform: high-level design</text>
  <text class="subtitle" x="30" y="68">System context for governance review. Numbered flows are explained in architecture-narrative.md. Production shown; non-production accounts follow the same pattern.</text>

  <!-- ================= Delivery zone ================= -->
  <rect class="tb" x="24" y="96" width="318" height="560" rx="14"/>
  <text class="tbl" x="40" y="118">TRUST BOUNDARY · DELIVERY ZONE</text>

  <rect class="box dev" x="44" y="134" width="278" height="64"/>
  <text class="h" x="60" y="160">Engineers</text>
  <text class="t" x="60" y="181">Sign in through agency SSO only</text>

  <rect class="box dev" x="44" y="224" width="278" height="150"/>
  <text class="h" x="60" y="250">GitLab (self-managed)</text>
  <text class="t" x="60" y="272">• App repos: code, Dockerfile, manifests</text>
  <text class="t" x="60" y="291">• Environment repo: approved image digests</text>
  <text class="t" x="60" y="310">• Policy repo: org rules (security owns)</text>
  <text class="t" x="60" y="329">• Protected production environment:</text>
  <text class="t" x="72" y="348">security + service-owner approval</text>

  <rect class="box dev" x="44" y="400" width="278" height="232"/>
  <text class="h" x="60" y="426">CI runners (ephemeral, unprivileged)</text>
  <text class="t" x="60" y="449">Gates before anything ships:</text>
  <text class="t" x="60" y="469">• Secrets scan  • Policy check (no</text>
  <text class="t" x="72" y="487">cluster-admin, no privileged pods)</text>
  <text class="t" x="60" y="507">• IaC + code scan  • Image CVE scan</text>
  <text class="t" x="60" y="527">• SBOM + signature (KMS key)</text>
  <text class="t" x="60" y="553" font-weight="700">CI never holds cluster credentials.</text>
  <text class="t" x="60" y="573">It only commits an image digest to the</text>
  <text class="t" x="60" y="592">environment repo; the cluster pulls.</text>
  <text class="t" x="60" y="614">Cloud access: OIDC, 15-minute tokens.</text>

  <!-- ================= Identity provider ================= -->
  <rect class="box sec" x="24" y="690" width="318" height="120"/>
  <text class="h" x="40" y="716">Agency identity provider (SSO)</text>
  <text class="t" x="40" y="739">One identity for people across</text>
  <text class="t" x="40" y="758">GitLab, AWS and Kubernetes.</text>
  <text class="t" x="40" y="777">MFA; joiner/mover/leaver handled once.</text>
  <text class="t" x="40" y="796">Feeds AWS IAM Identity Center → EKS.</text>

  <!-- ================= AWS Organisation ================= -->
  <rect class="tb" x="372" y="84" width="900" height="824" rx="14"/>
  <text class="tbl" x="388" y="104">TRUST BOUNDARY · AWS ORGANISATION (GOVERNMENT LANDING ZONE)</text>

  <!-- non-prod shadow -->
  <rect class="env" x="408" y="146" width="610" height="752" rx="12" fill="#F8FAFC"/>
  <text class="envl" x="420" y="890">Non-production accounts: identical pattern, separate keys, separate clusters</text>

  <!-- prod account -->
  <rect x="392" y="132" width="610" height="738" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text class="envl" x="406" y="858">ENVIRONMENT BOUNDARY · PRODUCTION WORKLOAD ACCOUNT</text>

  <!-- Row 1: edge + egress -->
  <rect class="box ext" x="408" y="168" width="282" height="96"/>
  <text class="h" x="422" y="193">Internet edge (only way in)</text>
  <text class="t" x="422" y="215">Web application firewall: managed rules,</text>
  <text class="t" x="422" y="234">rate limits. Load balancer, TLS 1.2+.</text>
  <text class="t" x="422" y="253">No public node ports.</text>

  <rect class="box ext" x="706" y="168" width="282" height="96"/>
  <text class="h" x="720" y="193">Egress firewall (only way out)</text>
  <text class="t" x="720" y="215">Default: no internet access.</text>
  <text class="t" x="720" y="234">Allowlisted domains only, per</text>
  <text class="t" x="720" y="253">environment, reviewed on request.</text>

  <!-- EKS cluster -->
  <rect class="tb" x="408" y="284" width="580" height="310" rx="12"/>
  <text class="tbl" x="568" y="305">TRUST BOUNDARY · EKS CLUSTER (private API endpoint)</text>

  <rect class="box run" x="424" y="318" width="272" height="140"/>
  <text class="h" x="438" y="343">Citizen-facing services</text>
  <text class="t" x="438" y="365">One namespace per service</text>
  <text class="t" x="438" y="384">Pod security "restricted"</text>
  <text class="t" x="438" y="403">Network: deny unless allowed</text>
  <text class="t" x="438" y="422">Own cloud identity per workload</text>
  <text class="t" x="438" y="441">No root, no host access</text>

  <rect class="box run" x="424" y="472" width="272" height="106"/>
  <text class="h" x="438" y="497">COTS product (isolated)</text>
  <text class="t" x="438" y="519">Dedicated nodes, strict network</text>
  <text class="t" x="438" y="538">allowlist, tight runtime baseline,</text>
  <text class="t" x="438" y="557">time-boxed risk acceptance</text>

  <rect class="box sec" x="710" y="318" width="262" height="260"/>
  <text class="h" x="724" y="343">Platform guardrails</text>
  <text class="t" x="724" y="366">• Admission control: only signed</text>
  <text class="t" x="736" y="385">images; no cluster-admin; no</text>
  <text class="t" x="736" y="404">privileged pods</text>
  <text class="t" x="724" y="428">• GitOps controller: pulls approved</text>
  <text class="t" x="736" y="447">changes from Git</text>
  <text class="t" x="724" y="471">• Runtime detection on every node</text>
  <text class="t" x="724" y="495">• Secrets operator: fetches secrets</text>
  <text class="t" x="736" y="514">from the vault at runtime</text>
  <text class="t" x="724" y="538">• Audit log of every API call</text>
  <text class="t" x="724" y="562">• Same set in every cluster, any cloud</text>

  <!-- Row 3: registry, data, secrets -->
  <rect class="box dat" x="408" y="624" width="182" height="112"/>
  <text class="h" x="422" y="650">Image registry</text>
  <text class="t" x="422" y="672">Signed images only</text>
  <text class="t" x="422" y="691">SBOM attached</text>
  <text class="t" x="422" y="710">Tags can't be overwritten</text>

  <rect class="box dat" x="606" y="624" width="182" height="112"/>
  <text class="h" x="620" y="650">Databases / cache</text>
  <text class="t" x="620" y="672">Private subnets only</text>
  <text class="t" x="620" y="691">TLS in transit</text>
  <text class="t" x="620" y="710">Encrypted, agency key</text>

  <rect class="box dat" x="806" y="624" width="182" height="112"/>
  <text class="h" x="820" y="650">Secrets vault + keys</text>
  <text class="t" x="820" y="672">Secrets Manager</text>
  <text class="t" x="820" y="691">Agency-controlled keys</text>
  <text class="t" x="820" y="710">Every use logged</text>

  <rect class="box ext" x="408" y="758" width="580" height="62"/>
  <text class="t" x="422" y="782">Private network for cluster, data and AWS APIs (VPC endpoints). Nodes have no public IPs.</text>
  <text class="t" x="422" y="802">Admin access: SSO → short-lived role → audited session. No SSH, no static keys.</text>

  <!-- ================= Security account ================= -->
  <rect class="env" x="1030" y="132" width="226" height="738" rx="12"/>
  <text class="envl" x="1042" y="153">SECURITY &amp; LOG ARCHIVE</text>
  <text class="envl" x="1042" y="170">ACCOUNT</text>

  <rect class="box sec" x="1044" y="188" width="198" height="150"/>
  <text class="h" x="1058" y="214">Central log archive</text>
  <text class="t" x="1058" y="236">Audit, app, network and</text>
  <text class="t" x="1058" y="255">cloud logs</text>
  <text class="t" x="1058" y="277">Write-once storage:</text>
  <text class="t" x="1058" y="296">cluster admins can't</text>
  <text class="t" x="1058" y="315">delete it</text>

  <rect class="box sec" x="1044" y="354" width="198" height="150"/>
  <text class="h" x="1058" y="380">SIEM + alerting</text>
  <text class="t" x="1058" y="402">Runtime alerts</text>
  <text class="t" x="1058" y="421">Cloud threat detection</text>
  <text class="t" x="1058" y="440">24×7 paging for</text>
  <text class="t" x="1058" y="459">Critical only</text>
  <text class="t" x="1058" y="482">Compliance dashboards</text>

  <rect class="box sec" x="1044" y="520" width="198" height="110"/>
  <text class="h" x="1058" y="546">Incident evidence</text>
  <text class="t" x="1058" y="568">Forensic store, tamper-</text>
  <text class="t" x="1058" y="587">proof, IR team only</text>

  <rect class="box sec" x="1044" y="646" width="198" height="110"/>
  <text class="h" x="1058" y="672">Vulnerability tracking</text>
  <text class="t" x="1058" y="694">Every running image's</text>
  <text class="t" x="1058" y="713">SBOM re-checked daily</text>
  <text class="t" x="1058" y="732">against new CVEs</text>

  <!-- ================= Internet ================= -->
  <rect class="tb" x="1298" y="132" width="282" height="222" rx="14"/>
  <text class="tbl" x="1314" y="154">TRUST BOUNDARY · INTERNET</text>

  <rect class="box ext" x="1318" y="166" width="242" height="76"/>
  <text class="h" x="1334" y="191">Citizens</text>
  <text class="t" x="1334" y="213">Unpredictable traffic,</text>
  <text class="t" x="1334" y="231">untrusted by default</text>

  <rect class="box ext" x="1318" y="258" width="242" height="80"/>
  <text class="h" x="1334" y="283">Approved external APIs</text>
  <text class="t" x="1334" y="305">e.g. payment provider,</text>
  <text class="t" x="1334" y="323">COTS vendor licence server</text>

  <!-- ================= Roadmap ================= -->
  <rect class="fut" x="1298" y="378" width="282" height="300" rx="14"/>
  <text class="h" x="1314" y="406">Roadmap: Azure &amp; GCP</text>
  <rect class="box ext" x="1318" y="422" width="242" height="66" stroke-dasharray="6 5"/>
  <text class="h" x="1334" y="447">AKS cluster</text>
  <text class="t" x="1334" y="469">Same guardrails, same pipeline</text>
  <rect class="box ext" x="1318" y="502" width="242" height="66" stroke-dasharray="6 5"/>
  <text class="h" x="1334" y="527">GKE cluster</text>
  <text class="t" x="1334" y="549">Same guardrails, same pipeline</text>
  <text class="t" x="1314" y="600">Changes per cloud: registry, key</text>
  <text class="t" x="1314" y="619">service, firewall, identity trust.</text>
  <text class="t" x="1314" y="642">Unchanged: policies, pipeline,</text>
  <text class="t" x="1314" y="661">detection rules, runbooks.</text>

  <!-- ================= Legend ================= -->
  <rect x="1298" y="702" width="282" height="140" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text class="h" x="1314" y="726">Legend</text>
  <line x1="1314" y1="746" x2="1360" y2="746" class="tb"/>
  <text class="t" x="1370" y="750">Trust boundary</text>
  <line x1="1314" y1="770" x2="1360" y2="770" class="env"/>
  <text class="t" x="1370" y="774">Environment / account boundary</text>
  <line x1="1314" y1="794" x2="1356" y2="794" class="flow"/>
  <text class="t" x="1370" y="798">Data / request flow (numbered)</text>
  <line x1="1314" y1="818" x2="1356" y2="818" class="flowx"/>
  <text class="t" x="1370" y="822">Deliberately blocked path</text>

  <!-- ================= Flows ================= -->
  <!-- 1 engineers -> gitlab -->
  <path class="flow" d="M183,198 L183,222"/>
  <circle class="num" cx="200" cy="211" r="10"/><text class="numt" x="200" y="215">1</text>

  <!-- 2 runners -> registry -->
  <path class="flow" d="M322,590 C370,590 360,690 406,690"/>
  <circle class="num" cx="356" cy="645" r="10"/><text class="numt" x="356" y="649">2</text>

  <!-- 3 GitLab -> cluster (cluster pulls) -->
  <path class="flow" d="M322,330 C360,330 370,380 406,380"/>
  <circle class="num" cx="357" cy="354" r="10"/><text class="numt" x="357" y="358">3</text>

  <!-- blocked: CI runners -> cluster API -->
  <path class="flowx" d="M322,470 C360,470 370,530 406,530"/>
  <text class="t" x="46" y="650" fill="#B42318" font-weight="700">✕ No CI path or credentials to the cluster API</text>

  <!-- 4 registry -> cluster (pull by digest) -->
  <path class="flow" d="M500,624 L500,596"/>
  <circle class="num" cx="517" cy="611" r="10"/><text class="numt" x="517" y="615">4</text>

  <!-- 5 citizens -> edge -> services -->
  <path class="flow" d="M1535,166 L1535,130 C1535,120 1527,118 1515,118 L600,118 C560,118 549,140 549,166"/>
  <circle class="num" cx="900" cy="118" r="10"/><text class="numt" x="900" y="122">5</text>
  <path class="flow" d="M549,264 L549,316"/>

  <!-- 6 services -> data ; secrets -> cluster -->
  <path class="flow" d="M697,596 L697,622"/>
  <circle class="num" cx="680" cy="611" r="10"/><text class="numt" x="680" y="615">6</text>
  <path class="flow" d="M897,622 L897,596"/>

  <!-- 7 logs -> security account -->
  <path class="flow" d="M988,440 C1015,440 1015,262 1042,262"/>
  <circle class="num" cx="1015" cy="350" r="10"/><text class="numt" x="1015" y="354">7</text>

  <!-- 8 services -> egress -> external APIs -->
  <path class="flow" d="M960,316 L960,266"/>
  <path class="flow" d="M988,200 C1010,200 1012,130 1040,130 L1270,130 C1284,130 1285,140 1285,160 L1285,280 C1285,296 1298,298 1316,298"/>
  <circle class="num" cx="1150" cy="130" r="10"/><text class="numt" x="1150" y="134">8</text>

  <!-- 9 IdP -> AWS admin access -->
  <path class="flow" d="M342,750 C375,750 372,790 406,790"/>
  <circle class="num" cx="372" cy="770" r="10"/><text class="numt" x="372" y="774">9</text>
</svg>
