# Illustrative GitLab CI for an application repo on the programme's platform.
# Design rationale: pipeline-design.md (same folder).
#
# Principles this file is built around:
#   1. CI never holds cluster credentials. Deploy = commit a new image digest to
#      the environment repo; Argo CD in the cluster pulls it. A compromised job
#      can't reach the API server, which is the F-01 lesson.
#   2. Cloud access via GitLab OIDC id_tokens -> short-lived role. No stored keys.
#   3. Every tool image is pinned by digest. In 2026 the Trivy and KICS Docker
#      Hub tags were repointed to credential stealers; a tag is not a version.
#   4. Hard-fail gates block the merge. Soft-fail gates report and are tracked,
#      then ratchet to hard-fail on a published date.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - secrets
  - validate
  - static-analysis
  - build
  - image-scan
  - sign-attest
  - deploy-staging
  - deploy-production

variables:
  # Tool images: digest-pinned, bumped only by Renovate MRs that a human reviews,
  # with a ~14-day cooldown on new releases (most malicious releases are caught
  # within days). Every public tool digest below is the one actually run for this
  # assessment (01-findings/evidence/). CI_TOOLS_IMAGE is internal and illustrative.
  GITLEAKS_IMAGE: "docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  KUBECONFORM_IMAGE: "ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f"  # -alpine: the default image has no shell, so GitLab can't run a script in it
  CONFTEST_IMAGE: "docker.io/openpolicyagent/conftest:v0.70.1@sha256:82f23e0e1f3faf2f3798f4b1974676c1aed96b05c6656ec6820435c31867c532"
  CHECKOV_IMAGE: "docker.io/bridgecrew/checkov:3.3.19@sha256:d3e96adafdb315ca82e792ca8708c01adae85292800fb064c8b309b3d0cb7b80"
  KUBESCORE_IMAGE: "docker.io/zegl/kube-score:v1.20.0@sha256:ac4c43ad560af905d66f6bf57b0937c591332e6dbf2167c31193a13b4695ab97"
  SEMGREP_IMAGE: "docker.io/semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b"
  TRIVY_IMAGE: "docker.io/aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"   # never 0.69.4-0.69.6 (malicious, Mar 2026)
  # Platform-built image (buildah, aws-cli, syft, cosign, crane, yq, git), every
  # binary checksum-verified at build time, rebuilt weekly, itself signed.
  CI_TOOLS_IMAGE: "111122223333.dkr.ecr.ap-southeast-1.amazonaws.com/platform/ci-tools@sha256:<digest>"

  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 111122223333.dkr.ecr.ap-southeast-1.amazonaws.com
  IMAGE: $ECR_REGISTRY/$CI_PROJECT_NAME
  COSIGN_KEY: awskms:///alias/ci-image-signing
  MANIFEST_DIR: deploy/

default:
  # Ephemeral, unprivileged runners only. No Docker-in-Docker, no privileged mode.
  tags: [k8s-runner-unprivileged]
  interruptible: true

# Reusable: short-lived AWS credentials from the GitLab OIDC token.
# The AWS SDK (used by Trivy, Cosign's awskms provider and the AWS CLI) reads
# AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE and assumes the role itself, so no
# access keys are ever stored in GitLab. The IAM role trust policy pins `sub` to
# this project and to protected refs, so a feature branch or a fork can't
# assume the push/signing role.
.aws-oidc:
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  variables:
    AWS_ROLE_ARN: $CI_ROLE_ARN
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/aws-web-identity-token
    AWS_ROLE_SESSION_NAME: gitlab-$CI_PROJECT_ID-$CI_PIPELINE_ID
  before_script:
    - printf '%s' "$AWS_ID_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

# ----------------------------------------------------------------- secrets
gitleaks:
  stage: secrets
  image: { name: $GITLEAKS_IMAGE, entrypoint: [""] }
  variables:
    GIT_DEPTH: "0"   # full history; a shallow clone can't see the MR's base commit
  script:
    # Full history on MRs: a secret added then deleted in the same MR is still leaked.
    - gitleaks git --redact --verbose --log-opts="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1}..HEAD" .
  # HARD FAIL (F-05, F-11)

# ---------------------------------------------------------------- validate
kubeconform:
  stage: validate
  image: { name: $KUBECONFORM_IMAGE, entrypoint: [""] }
  script:
    # Rejects malformed YAML and APIs removed in the target EKS version (F-29).
    # 1.36: current EKS standard-support version (1.33 left standard support in July 2026).
    # CRDs (ExternalSecret, Kyverno policies) are validated from the CRDs catalog, not skipped.
    - >
      /kubeconform -strict -summary -kubernetes-version 1.36.0
      -schema-location default
      -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      $MANIFEST_DIR
  # HARD FAIL

# --------------------------------------------------------- static-analysis
conftest-policy:
  stage: static-analysis
  image: { name: $CONFTEST_IMAGE, entrypoint: [""] }
  script:
    # The gate that would have stopped the cluster-admin ClusterRoleBinding (F-01).
    # Policies come from a central, CODEOWNERS-protected repo, pulled at a pinned ref,
    # so an app team can't weaken the rule in the same MR that breaks it.
    - conftest pull "git::https://gitlab.internal/platform/policies.git//conftest?ref=${POLICY_REF}" --policy policy/
    - conftest test --policy policy/ --all-namespaces --output junit $MANIFEST_DIR > conftest.xml || (cat conftest.xml; exit 1)
  artifacts:
    when: always
    reports: { junit: conftest.xml }
  # HARD FAIL on `deny`, report-only on `warn`

checkov-iac:
  stage: static-analysis
  image: { name: $CHECKOV_IMAGE, entrypoint: [""] }
  script:
    # Hard-fail on a curated list of high-impact checks; everything else soft.
    - >
      checkov -d . --framework terraform kubernetes helm
      --hard-fail-on CKV_AWS_39,CKV_AWS_38,CKV_AWS_37,CKV_AWS_58,CKV_AWS_51,CKV_AWS_136,CKV_AWS_163,CKV_AWS_130,CKV2_AWS_11,CKV_K8S_16,CKV_K8S_17,CKV_K8S_19,CKV_K8S_20,CKV_K8S_27,CKV_K8S_49,CKV2_K8S_5
      --soft-fail
      --output cli --output junitxml --output-file-path console,checkov.xml
  artifacts:
    when: always
    reports: { junit: checkov.xml }
  # All IDs verified against Checkov 3.3.19 output (01-findings/evidence/):
  # CKV_AWS_39/38 public EKS endpoint (F-15), CKV_AWS_37 control-plane logging (F-16),
  # CKV_AWS_58 secrets encryption (F-23), CKV_AWS_51/136/163 ECR immutable/KMS/scan (F-25),
  # CKV_AWS_130 public IPs on subnets (F-22), CKV2_AWS_11 VPC flow logs (F-30),
  # CKV_K8S_16/17/19/20 privileged/hostPID/hostNetwork/privesc (F-02),
  # CKV_K8S_27 docker socket (F-03), CKV_K8S_49 wildcard roles and CKV2_K8S_5
  # read-all-secrets (F-04/F-08).
  # NOTE: no Checkov check flags a binding to the built-in cluster-admin role (verified:
  # zero results on goat's insecure-rbac/setup.yaml). F-01 is caught by conftest-policy.

kube-score:
  stage: static-analysis
  image: { name: $KUBESCORE_IMAGE, entrypoint: [""] }
  script:
    - kube-score score $MANIFEST_DIR*.yaml --output-format ci
  allow_failure: true
  # SOFT FAIL: reliability hygiene (probes, PDBs, anti-affinity). Useful, not a security gate.

semgrep-sast:
  stage: static-analysis
  image: $SEMGREP_IMAGE
  script:
    # Registry packs + organisation rules. In testing, the registry packs missed the shell
    # injection (F-03) and the SSRF (F-09) and rated Flask debug (F-10) only WARNING;
    # the org rules catch all three (01-findings/evidence/semgrep-org-rules.txt).
    - git clone --depth 1 --branch "$POLICY_REF" "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.internal/platform/policies.git" .org-policies
    - >
      semgrep scan --metrics=off --config p/ci --config p/command-injection --config p/flask
      --config .org-policies/semgrep/org-rules.yaml --error --severity ERROR --junit-xml -o semgrep.xml
  artifacts:
    when: always
    reports: { junit: semgrep.xml }
  # HARD FAIL on ERROR severity; WARNING findings are reported in the MR only

# ------------------------------------------------------------------- build
build-image:
  stage: build
  extends: .aws-oidc
  image: $CI_TOOLS_IMAGE
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  script:
    - aws ecr get-login-password | buildah login --username AWS --password-stdin $ECR_REGISTRY
    - buildah bud --layers --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" -t $IMAGE:$CI_COMMIT_SHA .
    - buildah push --digestfile image.digest $IMAGE:$CI_COMMIT_SHA
    - echo "IMAGE_DIGEST=$(cat image.digest)" >> build.env
  artifacts:
    reports: { dotenv: build.env }
  # Push goes to a `staging/` ECR path. Only signed images are promoted (copied)
  # to the release path, and ECR tags are IMMUTABLE (F-25).

# -------------------------------------------------------------- image-scan
trivy-image:
  stage: image-scan
  extends: .aws-oidc
  image: { name: $TRIVY_IMAGE, entrypoint: [""] }
  script:
    # Vulnerabilities AND secrets inside the image layers (F-05, F-26).
    - trivy image --scanners vuln,secret --ignore-unfixed --severity CRITICAL,HIGH --exit-code 0 --format template --template "@/contrib/gitlab.tpl" -o gl-container-scanning-report.json $IMAGE@$IMAGE_DIGEST
    - trivy image --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 $IMAGE@$IMAGE_DIGEST
    - trivy image --scanners secret --exit-code 1 $IMAGE@$IMAGE_DIGEST
  artifacts:
    reports: { container_scanning: gl-container-scanning-report.json }
  # HARD FAIL: fixable CRITICAL CVEs, any secret. HIGH = reported, ratchets to hard-fail.

# ------------------------------------------------------------- sign-attest
sbom-sign-attest:
  stage: sign-attest
  extends: .aws-oidc
  image: $CI_TOOLS_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # only protected-branch builds get signed
  script:
    # SBOM (CycloneDX) generated from the built image, not the source tree,
    # so it lists what actually ships.
    - syft $IMAGE@$IMAGE_DIGEST -o cyclonedx-json=sbom.cdx.json
    # Sign with a KMS-held key: the private key never exists on the runner.
    - cosign sign --yes --tlog-upload=false --key $COSIGN_KEY $IMAGE@$IMAGE_DIGEST
    - cosign attest --yes --tlog-upload=false --key $COSIGN_KEY --type cyclonedx --predicate sbom.cdx.json $IMAGE@$IMAGE_DIGEST
    # SLSA provenance for the image: written from CI variables (commit, pipeline, runner),
    # then signed with the same KMS key. GitLab's runner metadata covers job artifacts
    # and isn't signed on its own, so it isn't relied on for the image.
    - ./ci/write-provenance.sh "$IMAGE@$IMAGE_DIGEST" > provenance.json
    - cosign attest --yes --tlog-upload=false --key $COSIGN_KEY --type slsaprovenance1 --predicate provenance.json $IMAGE@$IMAGE_DIGEST
    # SBOM also goes to Dependency-Track so new CVEs against already-deployed
    # images raise alerts without waiting for the next build.
    - 'curl -sf -X POST "$DTRACK_URL/api/v1/bom" -H "X-Api-Key: $DTRACK_API_KEY" -F "autoCreate=true" -F "projectName=$CI_PROJECT_NAME" -F "projectVersion=$IMAGE_DIGEST" -F "bom=@sbom.cdx.json"'
  artifacts:
    paths: [sbom.cdx.json]
    expire_in: 1 year
  # See pipeline-design.md for why SLSA Build L2 now and L3 later.

# ---------------------------------------------------------- deploy-staging
deploy-staging:
  stage: deploy-staging
  image: $CI_TOOLS_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment: { name: staging }
  script:
    # GitOps: bump the digest in the environment repo; Argo CD syncs it.
    # This job's token can only write to the staging path (project access token,
    # protected variable, scoped to that repo).
    - ./ci/bump-digest.sh staging "$IMAGE@$IMAGE_DIGEST"

# ------------------------------------------------------- deploy-production
deploy-production:
  stage: deploy-production
  image: $CI_TOOLS_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production
    deployment_tier: production
  # `production` is a GitLab protected environment with a required approval rule:
  # one approver from @platform-security and one from the service owner group,
  # and the person who triggered the pipeline can't approve their own deployment.
  # The approver sees the pipeline's security report and SBOM before approving.
  script:
    - ./ci/bump-digest.sh production "$IMAGE@$IMAGE_DIGEST"
